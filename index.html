<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7CB9E8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- The background of the very first frame, before the app's styles load:
         dark for a dark theme, so opening the app at night is not a white flash. -->
    <style>
        html { background: #ffffff; color-scheme: light; }
        html[data-theme="dark"] { background: #0f172a; color-scheme: dark; }
    </style>
    <script src="/theme-boot.js"></script>
    <link rel="preload" href="/css/welcome.css" as="style">
    <link rel="preload" href="/css/schedule.css" as="style">
    <link rel="preload" href="/css/schedule-mobile.css" as="style">
    <!-- Admin styles are not preloaded: on a weak campus network every
         student would download 40 KB they never use. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>КАИ Расписание</title>
    <meta name="description" content="Расписание занятий для студентов. Выберите университет, группу и подгруппу.">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
